# Server Configuration
server.port=${PORT:${SERVER_PORT:8080}}
server.servlet.context-path=/api
server.address=0.0.0.0

# gzip response compression - TripJack search responses run 2.5MB+ raw JSON;
# JSON compresses 70-90%, which directly cuts the bandwidth Render charges
# for beyond the included allotment. Only kicks in for clients that send
# "Accept-Encoding: gzip" (every real HTTP client does) and responses over
# 1KB, so tiny responses skip the compression overhead entirely.
server.compression.enabled=true
server.compression.min-response-size=1024
server.compression.mime-types=application/json,application/xml,text/html,text/plain,text/css,application/javascript

# Database Configuration
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/itinera_db}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration
# No fallback default on purpose - a hardcoded default here would be visible in the
# public repo, letting anyone forge valid tokens for any user/role if a deployment
# ever forgets to set JWT_SECRET. Fail fast at startup instead.
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:604800000}

# Auth Policy
auth.max-admin-count=${AUTH_MAX_ADMIN_COUNT:2}
auth.authorized-admin-emails=${AUTHORIZED_ADMIN_EMAILS:admin@itinera.com}

# Demo user seeding (DataSeederConfig) - creates accounts with well-known
# passwords (see README/CLAUDE.md demo credentials). Must be off in production.
app.seed-demo-users=${SEED_DEMO_USERS:true}

# Google Auth
google.web-client-id=${GOOGLE_WEB_CLIENT_ID:}
google.ios-client-id=${GOOGLE_IOS_CLIENT_ID:}
google.android-client-id=${GOOGLE_ANDROID_CLIENT_ID:}

# AI Service
ai.service.url=${AI_SERVICE_URL:http://localhost:8000}

# TripJack Flight API
tripjack.base-url=${TRIPJACK_BASE_URL:https://apitest.tripjack.com}
tripjack.api-key=${TRIPJACK_API_KEY:}
# Separate UAT key for certifying NEW TripJack products (Cabs, TripSafe) -
# never used by the already-live flights/hotels/activities integrations,
# which keep using tripjack.api-key above.
tripjack.test-api-key=${TRIPJACK_TEST_API_KEY:}

# TripJack Hotel API (separate host - HMS)
tripjack.hotel-base-url=${TRIPJACK_HOTEL_BASE_URL:https://apitest-hms.tripjack.com}
# TripJack Hotel Booking API (separate host again - Book/Booking Details/Cancel)
tripjack.hotel-booker-base-url=${TRIPJACK_HOTEL_BOOKER_BASE_URL:https://apitest-hotel-booker.tripjack.com}
# TripJack Cabs API (separate host again - UAT only, uses tripjack.test-api-key above)
tripjack.cabs-base-url=${TRIPJACK_CABS_BASE_URL:https://apitest-cabs.tripjack.com}
# Numeric TripJack account User Id required in every Cabs Book/Payment
# request (see TripJackConfig.cabsAgentId for where this comes from)
tripjack.cabs-agent-id=${TRIPJACK_CABS_AGENT_ID:}
# TripJack TripSafe (travel insurance) API (separate host again - UAT only, uses tripjack.test-api-key above)
tripjack.tripsafe-base-url=${TRIPJACK_TRIPSAFE_BASE_URL:https://apitest.tripjack.com}

# Cabs + TripSafe production (both certified 2026-09) - shared production
# domain confirmed live against the working production Flights key, uses
# tripjack.api-key above, never tripjack.test-api-key. See CabsService/
# TripSafeService (postCabsLive/postTripSafeLive) for where these are used.
tripjack.cabs-prod-base-url=${TRIPJACK_CABS_PROD_BASE_URL:https://tripjack.com}
tripjack.tripsafe-prod-base-url=${TRIPJACK_TRIPSAFE_PROD_BASE_URL:https://tripjack.com}
# Production account's numeric User Id - distinct from tripjack.cabs-agent-id
# (the UAT/test account's id) above.
tripjack.cabs-prod-agent-id=${TRIPJACK_CABS_PROD_AGENT_ID:}

# Activities API (HotelBeds/HBX Group - separate provider from TripJack)
activities.base-url=${ACTIVITIES_BASE_URL:https://api.test.hotelbeds.com}
activities.api-key=${ACTIVITIES_API_KEY:}
activities.secret=${ACTIVITIES_SECRET:}

# Gemini API (Google AI Studio free tier) - generates AI itinerary packages
# for destinations with no curated packages yet, see AiItineraryService.
gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
gemini.model=${GEMINI_MODEL:gemini-3.6-flash}
gemini.api-key=${GEMINI_API_KEY:}

# Email Configuration
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# NOTE: these spring.web.cors.* properties are NOT what guards the API -
# SecurityConfig defines its own CorsConfigurationSource bean, which takes
# precedence for the security filter chain. Edit cors.allowed-origins below.
spring.web.cors.allowed-origins=*
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# Logging
logging.level.com.itinera=${LOG_LEVEL:INFO}
logging.level.org.springframework.web=${LOG_LEVEL_WEB:INFO}

# Browser origins allowed to call the API (comma-separated, exact matches).
# Add the deployed web frontend here - without it the site loads but every
# API call is blocked by the browser.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:19006,http://localhost:8081,exp://localhost:19000,https://myitineri.com,https://www.myitineri.com}
