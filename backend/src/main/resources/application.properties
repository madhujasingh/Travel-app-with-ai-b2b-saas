# Server Configuration
server.port=${PORT:${SERVER_PORT:8080}}
server.servlet.context-path=/api
server.address=0.0.0.0

# Database Configuration
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/itinera_db}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration
# No fallback default on purpose - a hardcoded default here would be visible in the
# public repo, letting anyone forge valid tokens for any user/role if a deployment
# ever forgets to set JWT_SECRET. Fail fast at startup instead.
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:604800000}

# Auth Policy
auth.max-admin-count=${AUTH_MAX_ADMIN_COUNT:2}
auth.authorized-admin-emails=${AUTHORIZED_ADMIN_EMAILS:admin@itinera.com}

# Demo user seeding (DataSeederConfig) - creates accounts with well-known
# passwords (see README/CLAUDE.md demo credentials). Must be off in production.
app.seed-demo-users=${SEED_DEMO_USERS:true}

# Google Auth
google.web-client-id=${GOOGLE_WEB_CLIENT_ID:}
google.ios-client-id=${GOOGLE_IOS_CLIENT_ID:}
google.android-client-id=${GOOGLE_ANDROID_CLIENT_ID:}

# AI Service
ai.service.url=${AI_SERVICE_URL:http://localhost:8000}

# TripJack Flight API
tripjack.base-url=${TRIPJACK_BASE_URL:https://apitest.tripjack.com}
tripjack.api-key=${TRIPJACK_API_KEY:}

# TripJack Hotel API (separate host - HMS)
tripjack.hotel-base-url=${TRIPJACK_HOTEL_BASE_URL:https://apitest-hms.tripjack.com}
# TripJack Hotel Booking API (separate host again - Book/Booking Details/Cancel)
tripjack.hotel-booker-base-url=${TRIPJACK_HOTEL_BOOKER_BASE_URL:https://apitest-hotel-booker.tripjack.com}

# Email Configuration
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# mac CORS FIX (IMPORTANT)
spring.web.cors.allowed-origins=*
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# Logging
logging.level.com.itinera=${LOG_LEVEL:INFO}
logging.level.org.springframework.web=${LOG_LEVEL_WEB:INFO}
